x-hardening: &hardening
  init: true
  read_only: true
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  pids_limit: 128
  mem_limit: 512m
  cpus: 1.0
  tmpfs: [/tmp]
  logging:
    driver: json-file
    options: {max-size: 10m, max-file: "3"}

x-app-env: &app-env
  DB_NAME: ${DB_NAME:?Set DB_NAME}
  DB_APP_USER: ${DB_APP_USER:?Set DB_APP_USER}
  DB_APP_PASSWORD_FILE: /run/secrets/db-app
  LOG_LEVEL: ${LOG_LEVEL:-INFO}

services:
  db:
    <<: *hardening
    image: postgres:15.17-alpine
    restart: unless-stopped
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    tmpfs: [/tmp, /var/run/postgresql]
    environment:
      POSTGRES_DB: ${DB_NAME:?Set DB_NAME}
      POSTGRES_USER: ${DB_OWNER_USER:?Set DB_OWNER_USER}
      POSTGRES_PASSWORD_FILE: /run/secrets/db-owner
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    secrets: [db-owner]
    volumes: [postgres_data:/var/lib/postgresql/data]
    networks: [database]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    <<: *hardening
    build: {context: ./backend, target: runtime}
    command: [python, -m, app.bootstrap]
    restart: "no"
    environment:
      <<: *app-env
      DB_OWNER_USER: ${DB_OWNER_USER:?Set DB_OWNER_USER}
      DB_OWNER_PASSWORD_FILE: /run/secrets/db-owner
      DB_BACKUP_USER: ${DB_BACKUP_USER:?Set DB_BACKUP_USER}
      DB_BACKUP_PASSWORD_FILE: /run/secrets/db-backup
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Set ADMIN_EMAIL}
      ADMIN_PASSWORD_FILE: /run/secrets/admin-password
      ADMIN_TOTP_SECRET_FILE: /run/secrets/admin-totp
    secrets: [db-owner, db-app, db-backup, admin-password, admin-totp]
    networks: [database]
    depends_on:
      db: {condition: service_healthy}

  mosquitto:
    <<: *hardening
    image: eclipse-mosquitto:2.0.22
    user: "1883:1883"
    restart: unless-stopped
    ports:
      - "${MQTT_BIND_ADDRESS:-127.0.0.1}:${MQTT_PORT:-8883}:8883"
    volumes:
      - ./infrastructure/mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./infrastructure/mosquitto/config/device.acl:/mosquitto/config/device.acl:ro
      - type: bind
        source: ${MQTT_SERVER_PKI_DIR:?Set MQTT_SERVER_PKI_DIR}
        target: /run/mqtt-pki
        read_only: true
        bind: {create_host_path: false}
      - mosquitto_data:/mosquitto/data
      - type: tmpfs
        target: /mosquitto/log
    networks: [mqtt]
    healthcheck:
      test: [CMD-SHELL, 'nc -z -w 2 127.0.0.1 8883']
      interval: 10s
      timeout: 3s
      retries: 8

  backend:
    <<: *hardening
    build: {context: ./backend, target: runtime}
    restart: unless-stopped
    environment:
      <<: *app-env
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Set ADMIN_EMAIL}
      ADMIN_TOTP_SECRET_FILE: /run/secrets/admin-totp
    secrets: [db-app, admin-totp]
    networks: [database, web]
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6

  mqtt_worker:
    <<: *hardening
    build: {context: ./backend, target: runtime}
    command: [python, -m, worker.worker]
    restart: unless-stopped
    environment: *app-env
    secrets: [db-app]
    volumes:
      - type: bind
        source: ${MQTT_WORKER_PKI_DIR:?Set MQTT_WORKER_PKI_DIR}
        target: /run/worker-pki
        read_only: true
        bind: {create_host_path: false}
    networks: [database, mqtt]
    depends_on:
      migrate: {condition: service_completed_successfully}
      mosquitto: {condition: service_healthy}
    healthcheck:
      test: [CMD-SHELL, 'test -f /tmp/mqtt-ready && python -c "from app.database import get_engine; get_engine().connect().close()"']
      interval: 10s
      timeout: 6s
      retries: 6

  frontend:
    <<: *hardening
    build: {context: ./frontend, target: runtime}
    restart: unless-stopped
    ports:
      - "${HTTPS_BIND_ADDRESS:-0.0.0.0}:${HTTPS_PORT:-443}:8443"
    volumes:
      - type: bind
        source: ${WEB_PKI_DIR:?Set WEB_PKI_DIR}
        target: /run/web-pki
        read_only: true
        bind: {create_host_path: false}
    networks: [web, ingress]
    depends_on:
      backend: {condition: service_healthy}
    healthcheck:
      test: [CMD, wget, --no-check-certificate, -qO-, "https://127.0.0.1:8443/health/live"]
      interval: 10s
      timeout: 5s
      retries: 6

  backup:
    <<: *hardening
    build: ./infrastructure/backup
    tmpfs: [/tmp, /var/lib/postgresql/data]
    restart: unless-stopped
    environment:
      PGHOST: db
      PGDATABASE: ${DB_NAME:?Set DB_NAME}
      PGUSER: ${DB_BACKUP_USER:?Set DB_BACKUP_USER}
      BACKUP_AGE_RECIPIENT: ${BACKUP_AGE_RECIPIENT:?Set BACKUP_AGE_RECIPIENT}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_OFFHOST_URL: ${BACKUP_OFFHOST_URL:-}
    secrets: [db-backup, backup-offhost-auth]
    volumes: [backup_data:/backups]
    networks: [database, backup_egress]
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, /opt/backup/backup.sh, health]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  ingress: {}
  web: {internal: true}
  database: {internal: true}
  mqtt: {}
  backup_egress: {}

volumes:
  postgres_data:
  mosquitto_data:
  backup_data:

secrets:
  db-owner:
    file: ${SECRETS_DIR:?Set SECRETS_DIR}/db-owner
  db-app:
    file: ${SECRETS_DIR:?Set SECRETS_DIR}/db-app
  db-backup:
    file: ${SECRETS_DIR:?Set SECRETS_DIR}/db-backup
  admin-password:
    file: ${SECRETS_DIR:?Set SECRETS_DIR}/admin-password
  admin-totp:
    file: ${SECRETS_DIR:?Set SECRETS_DIR}/admin-totp
  backup-offhost-auth:
    file: ${SECRETS_DIR:?Set SECRETS_DIR}/backup-offhost-auth
