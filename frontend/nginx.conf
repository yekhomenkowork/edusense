worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 512; }

http {
    include /etc/nginx/mime.types;
    access_log /dev/stdout;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    server_tokens off;
    client_max_body_size 64k;
    limit_req_zone $binary_remote_addr zone=login:1m rate=10r/m;
    limit_req_zone $server_name zone=login_global:1m rate=2r/s;
    limit_req_status 429;

    server {
        listen 8443 ssl;
        ssl_certificate /run/web-pki/server.crt;
        ssl_certificate_key /run/web-pki/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        root /usr/share/nginx/html;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

        location = /health/live { access_log off; return 200 "live\n"; }
        location = /api/auth/login {
            limit_req zone=login burst=5 nodelay;
            limit_req zone=login_global burst=10 nodelay;
            proxy_pass http://backend:8000;
        }
        location /api/ { proxy_pass http://backend:8000; }
        location / { try_files $uri $uri/ /index.html; }
    }
}
